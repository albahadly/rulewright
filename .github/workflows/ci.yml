name: CI

# Runs on GitHub-hosted runners (cloud) or on self-hosted runners on the maintainer's
# machine (local). The CI_RUNNER repository variable picks the default (`cloud` when
# unset); a manual run can override it with the `runner` input. RUNNERS.md has the setup.
#
# A pull request from a FORK always runs in the cloud, whatever the switch says: this
# repository is public, and a self-hosted runner executes whatever the workflow asks,
# as the maintainer, on their machine. That check alone is not enough, because a fork's
# pull request runs the workflow file from the fork, which can say anything; the real
# guard is the repository setting that holds every outside contributor's run for
# approval (RUNNERS.md). Read a fork's workflow changes before approving its run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run this one run. 'default' follows the CI_RUNNER repository variable.
        type: choice
        options: [default, cloud, local]
        default: default

jobs:
  windows:
    name: Windows (net8.0 + net10.0 + net48)
    runs-on: ${{ ((inputs.runner != 'default' && inputs.runner) || vars.CI_RUNNER || 'cloud') == 'local' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["self-hosted","windows"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        # A self-hosted runner uses the machine's own SDK and runtimes: the step installs into
        # Program Files, which a runner running as a normal user cannot write.
        if: runner.environment != 'self-hosted'
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build RuleWright.slnx -c Release
        # No -f: every shipped leg that can host a run (net8.0, net10.0, net48).
      - name: Test (all target frameworks)
        run: dotnet test RuleWright.slnx -c Release --no-build
      - name: .NET Framework 4.8 smoke test
        run: dotnet run --project samples/RuleWright.Sample.NetFramework48 -c Release --no-build

  linux:
    name: Linux (net8.0 + net10.0)
    runs-on: ${{ ((inputs.runner != 'default' && inputs.runner) || vars.CI_RUNNER || 'cloud') == 'local' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["self-hosted","linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment != 'self-hosted'
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build RuleWright.slnx -c Release
      - name: Test (net8.0)
        run: dotnet test RuleWright.slnx -c Release --no-build -f net8.0

      - name: Test (net10.0)
        run: dotnet test RuleWright.slnx -c Release --no-build -f net10.0
      - name: Console sample smoke test
        run: dotnet run --project samples/RuleWright.Sample.ConsoleApp -c Release --no-build

      # Packaging is verified on every PR rather than discovered at release time: the
      # publish workflow runs this same pack, and a broken nuspec there means a tag that
      # cannot ship.
      - name: Pack (verify the publishable set)
        shell: bash
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -o artifacts/nuget
          done
          ls -1 artifacts/nuget
