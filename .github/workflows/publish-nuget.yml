name: Publish to NuGet

# Publishes the RuleWright.* packages to nuget.org.
#
# PUBLISHING IS DELIBERATE, NOT AUTOMATIC. Pushing to nuget.org cannot be undone —
# a version can be unlisted but never removed — so the trigger is an explicit act:
# push a `v*` tag, or run the workflow by hand from the Actions tab and type the
# confirmation.
#
# The version comes from <VersionPrefix> in src/Directory.Build.props and increments
# as an odometer past whatever is already on nuget.org (see the Compute version step).
#
# Auth is nuget.org Trusted Publishing (OIDC), not a long-lived API key: this job
# exchanges a GitHub-issued token for a NuGet API key that is valid for one hour.
# That requires a one-time Trusted Publishing policy on nuget.org (Account ->
# Trusted Publishing) pointing at this exact repository and workflow file:
#   Repository Owner: albahadly   Repository: rulewright   Workflow File: publish-nuget.yml
# plus a NUGET_USER repository secret holding the nuget.org profile name (not
# email) to authenticate as. No NUGET_API_KEY secret is used or needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm pushing packages to nuget.org.'
        required: true
        default: ""
      version:
        description: 'Exact version to publish (e.g. 0.1.1). Leave empty to use the odometer. Set this to finish a partially-published release: --skip-duplicate makes re-pushing the packages that already landed a no-op.'
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack and push RuleWright.* to nuget.org
    runs-on: ubuntu-latest
    # A manual run has to say so in as many words. A tag push is already deliberate.
    if: >
      github.event_name == 'push' ||
      github.event.inputs.confirm == 'publish'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # A tag can be pushed to any commit, including one that never saw CI, so the
      # gate is re-run here rather than assumed.
      - name: Build (all TFMs)
        run: dotnet build RuleWright.slnx -c Release

      - name: Test (net8.0)
        run: dotnet test RuleWright.slnx -c Release --no-build -f net8.0

      - name: Test (net10.0)
        run: dotnet test RuleWright.slnx -c Release --no-build -f net10.0

      - name: Compute version (auto-increment, or honor a manual VersionPrefix bump)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # An explicit version wins outright. This exists for recovery: if a push run
          # dies partway, some package IDs hold the version and some do not, and the
          # odometer below would step past it and strand the ones that already landed
          # on dependencies that never ship.
          pinned="${{ github.event.inputs.version }}"
          if [ -n "$pinned" ]; then
            if [[ ! "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version input '$pinned' is not a 3-part version"
              exit 1
            fi
            echo "version=$pinned" >> "$GITHUB_OUTPUT"
            echo "Publishing $pinned (pinned by workflow input)"
            exit 0
          fi

          # Versions are a base-100 odometer: the last number counts 0..99 then
          # carries, so 0.10.99 -> 0.11.0 and 0.99.99 -> 1.0.0. We work in a
          # single integer "ordinal" = major*10000 + minor*100 + patch.
          #
          #   - If <VersionPrefix> in the file is HIGHER than the newest version
          #     already on nuget.org, you bumped it by hand -> publish it exactly
          #     (no increment).
          #   - Otherwise -> publish one odometer step past the last release.
          #
          # So leaving VersionPrefix alone auto-increments; raising it pins the
          # next version to whatever you typed, and auto-increment resumes from
          # there on the following release.
          prefix=$(grep -oP '(?<=<VersionPrefix>)[0-9]+\.[0-9]+\.[0-9]+' src/Directory.Build.props | head -n1)
          if [ -z "$prefix" ]; then
            echo "::error::Could not read a 3-part <VersionPrefix> from src/Directory.Build.props"
            exit 1
          fi
          IFS=. read -r vmaj vmin vpatch <<< "$prefix"
          manual_ordinal=$((10#$vmaj * 10000 + 10#$vmin * 100 + 10#$vpatch))

          # Newest published version of the metapackage (all RuleWright.* packages
          # are versioned together), as an ordinal; -1 if none yet.
          latest_ordinal=-1
          versions=$(curl -fsSL "https://api.nuget.org/v3-flatcontainer/rulewright/index.json" \
            | jq -r '.versions[]?' 2>/dev/null || true)
          while IFS= read -r v; do
            [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
            ord=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
            (( ord > latest_ordinal )) && latest_ordinal=$ord
          done <<< "$versions"

          if (( manual_ordinal > latest_ordinal )); then
            ordinal=$manual_ordinal
            reason="manual VersionPrefix ($prefix)"
          else
            ordinal=$((latest_ordinal + 1))
            reason="auto-increment past ordinal $latest_ordinal"
          fi
          version="$((ordinal / 10000)).$(((ordinal / 100) % 100)).$((ordinal % 100))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version ($reason)"

      # Packs exactly the publishable set rather than the whole solution: a solution-wide
      # pack also walks the samples, which warns on the Web SDK project and would ship a
      # sample the moment one lost its IsPackable=false.
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -o artifacts/nuget -p:Version=${{ steps.ver.outputs.version }}
          done

      # Requested right before the push: the exchanged key is only valid for one hour.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Code packages first, symbols second, rather than letting push carry each .snupkg
      # alongside its .nupkg. A symbol package nuget.org rejects (a 400, which
      # --skip-duplicate does not swallow) aborts the whole command mid-glob, and the
      # packages after it in the glob never ship — leaving a metapackage live whose
      # dependencies do not exist. Splitting the passes means the code set is always
      # complete and self-consistent before symbols are attempted.
      - name: Push RuleWright.* to nuget.org
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
          --no-symbols

      - name: Push symbol packages
        run: >
          dotnet nuget push "artifacts/nuget/*.snupkg"
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
